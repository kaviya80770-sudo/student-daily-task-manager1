
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Daily Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Daily Task Manager</h1>
        <p>Organize your daily tasks easily!</p>

        <form id="taskForm">
            <input type="text" id="taskInput" placeholder="Enter your task" required>
            <button type="submit">Add Task</button>
        </form>

        <div class="filters">
            <button type="button" data-filter="all">All Tasks</button>
            <button type="button" data-filter="pending">Pending</button>
            <button type="button" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
